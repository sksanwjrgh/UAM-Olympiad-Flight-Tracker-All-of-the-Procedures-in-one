<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공항 셔틀형 UAM — 2차 발표</title>
<style>
:root{--bg:#f1f4f9;--card:#fff;--ink:#1e2430;--sub:#5b6577;--navy:#1f3864;--line:#d5dce6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1520;--card:#182131;--ink:#e6ebf2;--sub:#9aa7ba;--navy:#8fb0e8;--line:#2a3547}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.55}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:26px;margin:0 0 4px;color:var(--navy)}
.sub{color:var(--sub);font-size:14px;margin-bottom:20px}
h2{font-size:19px;margin:28px 0 10px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px}
@media (prefers-color-scheme:dark){.btn{color:#0f1520}}
.pdf{width:100%;height:78vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
video{width:100%;border-radius:8px;background:#000;display:block}
.v h3{font-size:15px;margin:10px 0 2px}
.v p{font-size:13px;color:var(--sub);margin:0}
.note{font-size:13px;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>공항 셔틀형 UAM 운항 조화 설계 — 2차 발표</h1>
  <div class="sub">2026 전국 대학생 UAM 올림피아드 · 공항활용 부문 · 팀 날아라 냥참 · 팀 내부 검토용</div>

  <h2>발표 자료 (15장)</h2>
  <div class="card">
    <div class="btns"><a class="btn" href="deck.pdf" target="_blank" rel="noopener">발표 PDF 열기</a><a class="btn" href="../">항로도(v17) 보기</a></div>
    <iframe class="pdf" src="deck.pdf" title="발표 자료 PDF"></iframe>
    <div class="note">휴대폰에서 PDF가 안 보이면 위의 '발표 PDF 열기'를 누르세요. 영상은 곧 이 페이지에 추가됩니다.</div>
  </div>

  <!-- 영상은 녹화가 끝나면 추가 -->
  <div class="note">모든 수치: 최종 운항 규칙(수직 강하 1,500 fpm 가정) · 82일 실측 14,569편 분리 미달 0 · UAM 간 근접 0 · 59일 최대 시간당 16편 · 도어투도어 약 51분.</div>
</main>
</body>
</html>
